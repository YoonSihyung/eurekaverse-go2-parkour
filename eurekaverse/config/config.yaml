defaults:
  - _self_
  - override hydra/launcher:  local
  - override hydra/output:  local

quadruped_model: "go2"                 # Robot model (our reproduction targets Unitree Go2)

iterations: 5                          # 논문 프로토콜: 5 iterations
train_iterations: 2000                 # Number of training iterations per generated environment (paper value; fork had 1500)
eval_steps: 1001                       # Number of evaluation steps per environment (1001 is fairly accurate, 10001 is most accurate)
num_terrain_types: 10                  # Number of terrains to generate
num_parallel_runs: 8                   # 논문과 동일한 폭 8 (fan-out으로 iter9의 승자6:2등2 분기)
max_concurrent_runs: 1                 # 단일 GPU: 동시에 도는 학습/평가 파이프라인 수. 반드시 1 (2 이상이면 VRAM/RAM 초과)
num_parallel_checks: 2                 # Number of parallel runs to query and check executability of GPT responses

render_images: False                   # Render generated environments (render.py not ported)
best_run_proportions: [0.75, 0.25]     # Proportion of next-iteration runs to train on for the best, next-best, etc. curent runs
deterministic_gpu: True                # Deterministically assign training and eval evenly across GPUs (assumes they are all empty)

wandb: False                           # Use wandb tracking

gpt_model: "gpt-5.4"                   # mini의 진화 보수화 문제로 풀 모델 승격 (docs/RUN_RESULTS.md)
initial_query_sample_multiplier: 4     # Multiplier for the number of samples to query in first iteration (paper value)
evolution_query_sample_multiplier: 4   # Multiplier for the number of samples to query in later iterations
max_gpt_queries: 10                    # Maximum number of attempted GPT queries for a single prompt

resume_run: ""      # 신규 런: walk_pretrain에서 iteration 0부터

hydra:
  job:
    chdir: True

# Terrain flags appended to train/eval commands (overwrite LeggedRobotCfg).
# MUST match the audited backend defaults (original: horizontal_scale 0.05, 10 rows).
terrain_train: # controls all training terrains
  terrain_length: 18
  terrain_width: 4
  vertical_scale: 0.005
  horizontal_scale: 0.05
  num_cols: 40
  num_rows: 10
  num_goals: 8

terrain_eval: # controls all eval terrains (same set_terrain functions as train but less terrain redundancy)
  terrain_length: 18
  terrain_width: 4
  vertical_scale: 0.005
  horizontal_scale: 0.05
  num_cols: 10
  num_rows: 10
  num_goals: 8

terrain_benchmark: # controls benchmark terrain (20 tasks -> 20 cols)
  terrain_length: 18
  terrain_width: 4
  vertical_scale: 0.005
  horizontal_scale: 0.05
  num_cols: 20
  num_rows: 10
  num_goals: 8
